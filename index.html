<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050810">
<title>Warfront</title>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #050810; color: #e0e0e0;
  font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  height: 100vh; width: 100vw; overflow: hidden; user-select: none;
  touch-action: none; overscroll-behavior: none; }
#c { position: fixed; inset: 0; display: block; cursor: crosshair; background: #050810; touch-action: none; }

/* ===== Quick controls ===== */
#quick-controls {
  position: fixed; right: 8px;
  top: max(8px, env(safe-area-inset-top, 8px));
  display: flex; flex-direction: column; gap: 6px;
  z-index: 12;
}
.qc-btn {
  width: 34px; height: 34px;
  background: rgba(11,11,20,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 50%;
  color: #777;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.5;
  transition: all 0.2s;
  padding: 0;
  touch-action: manipulation;
}
.qc-btn:hover, .qc-btn:active {
  opacity: 1;
  background: rgba(11,11,20,0.95);
  border-color: rgba(255,255,255,0.3);
  color: #fff;
}
.qc-btn.muted { color: #e74c3c; border-color: rgba(231,76,60,0.3); }
.qc-btn svg { width: 15px; height: 15px; }

#missile-panel { position: fixed; left: 8px;
  top: max(8px, env(safe-area-inset-top, 8px));
  width: 120px;
  background: rgba(11,11,20,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid #1a1a2e; border-radius: 8px; padding: 8px;
  z-index: 10; display: flex; flex-direction: column; gap: 4px; }
.mp-title { font-size: 10px; color: #e74c3c; font-weight: 700;
  text-align: center; letter-spacing: 1px; margin-bottom: 2px; display: flex; align-items: center; justify-content: center; gap: 4px; }
.mp-title svg { width: 14px; height: 14px; }
.mbtn { display: flex; flex-direction: column; align-items: center;
  min-height: 56px; background: #1a1a2e; border: 1px solid #2a2a4e; border-radius: 6px;
  padding: 5px; cursor: pointer; color: #ccc; font-family: inherit;
  transition: all 0.15s; gap: 1px; touch-action: manipulation; }
.mbtn:active, .mbtn.active { background: #4a1a1a; border-color: #e74c3c; color: #fff; }
.mbtn.disabled { opacity: 0.35; cursor: not-allowed; }
.mbtn.locked { display: none; }
.m-icon-svg { width: 18px; height: 18px; display: block; }
.m-name { font-size: 9px; font-weight: 600; }
.m-cost { font-size: 8px; color: #f1c40f; }
#bottom-bar { position: fixed;
  bottom: max(8px, env(safe-area-inset-bottom, 8px));
  left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; align-items: stretch; z-index: 20; max-width: calc(100vw - 16px); }
#stats-panel { padding: 8px 12px; background: rgba(11,11,20,0.94);
  border: 1px solid #1a1a2e; border-radius: 10px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; flex-direction: column; gap: 1px; justify-content: center;
  min-width: 96px; box-shadow: 0 -4px 30px rgba(0,0,0,0.5); }
.sp-limit { display: flex; align-items: baseline; justify-content: flex-end; gap: 2px; }
.sp-limit-big { color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; line-height: 1; }
.sp-limit-slash { color: #444; font-size: 11px; margin: 0 1px; }
.sp-limit-max { color: #9b8aff; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 11px; }
.sp-growth { font-size: 9px; color: #5a7a5a; text-align: right; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 2px; }
#send-panel { padding: 6px 10px; background: rgba(11,11,20,0.94);
  border: 1px solid #1a1a2e; border-radius: 10px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; flex-direction: column; gap: 3px; min-width: 180px;
  box-shadow: 0 -4px 30px rgba(0,0,0,0.5); justify-content: center; }
.send-label { font-size: 10px; color: #ccc; font-weight: 600;
  display: flex; align-items: center; gap: 4px; }
.send-label svg { width: 11px; height: 11px; }
.send-label span { color: #2ecc71; font-weight: 700; }
.send-btns { display: flex; gap: 2px; }
.send-btn {
  flex: 1 1 0; min-width: 0; padding: 7px 2px;
  font-size: 11px; font-weight: 700;
  background: #1a1a2e; color: #888;
  border: 1px solid #2a2a4e; border-radius: 4px;
  cursor: pointer; font-family: inherit;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.send-btn:hover { background: #2a2a4e; color: #ccc; }
.send-btn.active {
  background: #1a3a25; border-color: #2ecc71; color: #fff;
  box-shadow: 0 0 8px rgba(46,204,113,0.3);
}
.send-hint { font-size: 8px; color: #5a7a5a; }
.send-hint.active { color: #e67e22; font-weight: 600; }
#buildpanel { display: flex; gap: 3px; padding: 6px; background: rgba(11,11,20,0.94);
  border: 1px solid #1a1a2e; border-radius: 10px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  align-items: center; box-shadow: 0 -4px 30px rgba(0,0,0,0.5); overflow-x: auto; }
.bbtn { display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 48px; min-height: 48px; padding: 4px; background: #12121e; color: #ccc;
  border: 1px solid #2a2a4e; border-radius: 6px; cursor: pointer;
  font-family: inherit; transition: all 0.15s; gap: 1px; flex-shrink: 0; touch-action: manipulation; }
.bbtn:active, .bbtn.active { background: #1a3a25; border-color: #2ecc71; color: #fff; }
.bbtn.disabled { opacity: 0.35; cursor: not-allowed; }
.b-icon-svg { width: 18px; height: 18px; display: block; }
.b-name { font-size: 8px; font-weight: 600; }
.b-cost { font-size: 8px; color: #f1c40f; font-variant-numeric: tabular-nums; }
.bbtn-info { padding: 0 8px; border-left: 1px solid #2a2a4e; min-width: 80px;
  display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; }
.bbtn-info .money-line { font-size: 11px; font-weight: 700; color: #f1c40f;
  font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
.bbtn-info .money-line svg { width: 11px; height: 11px; }
.bbtn-info .income-line { font-size: 9px; color: #5a7a5a; margin-top: 1px; }
#toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(20,20,30,0.95); border: 1px solid #3a3a5e; color: #fff;
  padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 600;
  z-index: 30; opacity: 0; transition: all 0.25s ease; pointer-events: none;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ UNIFIED MENU STYLE ============ */
#menu-screen, .submenu, #overlay {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.94);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
}
#menu-screen { z-index: 1000; padding: 20px; display: flex; }
.submenu { z-index: 1100; padding: 60px 20px 20px; justify-content: flex-start;
  overflow-y: auto; }
.submenu.active { display: flex; animation: fadeIn 0.3s ease; }
#overlay { z-index: 1050; animation: fadeIn 0.5s ease; }
#overlay.show { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
#menu-preview { position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; filter: blur(20px) brightness(0.25) saturate(0.7); z-index: 0; }
#menu-topbar { position: absolute; top: 16px; right: 20px; z-index: 2;
  display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; color: #fff;
  background: rgba(255,255,255,0.06); padding: 8px 16px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15); }
#menu-topbar svg { width: 16px; height: 16px; }
#menu-content { position: relative; z-index: 1;
  display: flex; flex-direction: column;
  gap: 12px; align-items: center; min-width: 280px; max-width: 340px; }
.menu-title, .submenu-title, #overlay h1 {
  color: #fff; font-weight: 300; text-align: center;
  letter-spacing: 6px; text-transform: uppercase; margin: 0;
}
.menu-title { font-size: 40px; letter-spacing: 10px; margin-bottom: 6px;
  text-shadow: 0 0 40px rgba(255,255,255,0.3); }
.submenu-title { font-size: 22px; margin-bottom: 30px; }
#overlay h1 { font-size: 44px; margin-bottom: 8px;
  text-shadow: 0 0 40px currentColor; animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.menu-sub { text-align: center; font-size: 11px; letter-spacing: 4px; color: #555;
  margin: -4px 0 20px; text-transform: uppercase; }
.menu-input { width: 100%; padding: 14px 18px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
  color: #fff; font-size: 15px; text-align: center; font-family: inherit;
  outline: none; transition: border-color 0.2s; letter-spacing: 1px; }
.menu-input:focus { border-color: #fff; background: rgba(255,255,255,0.1); }
.menu-input::placeholder { color: #555; }
.menu-btn { width: 100%; min-height: 52px; padding: 14px 24px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; color: #ccc; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit; letter-spacing: 2px;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
  text-transform: uppercase; touch-action: manipulation; }
.menu-btn:active, .menu-btn:hover { background: rgba(255,255,255,0.12); color: #fff;
  border-color: rgba(255,255,255,0.4); }
.menu-btn svg { width: 18px; height: 18px; }
.menu-btn.primary { background: #fff; color: #000; border: none; font-weight: 700; font-size: 15px; }
.menu-btn.primary:active, .menu-btn.primary:hover { background: #e8e8e8;
  transform: translateY(-1px); box-shadow: 0 8px 30px rgba(255,255,255,0.2); }
.overlay-actions { display: flex; gap: 10px; margin-top: 32px;
  width: 100%; max-width: 360px; position: relative; z-index: 1; }
.overlay-actions .menu-btn { flex: 1; min-height: 48px; padding: 12px 16px; font-size: 13px; }
#overlay p { font-size: 14px; color: #aaa; margin: 8px 0 0; text-align: center; position: relative; z-index: 1; }
.submenu-content { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; padding: 24px; max-width: 500px; width: 100%; }
.submenu-close { position: fixed; top: 16px; right: 16px; width: 44px; height: 44px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%; color: #fff; cursor: pointer; display: flex;
  align-items: center; justify-content: center; z-index: 1110;
  transition: all 0.15s; touch-action: manipulation; }
.submenu-close:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
.submenu-close svg { width: 18px; height: 18px; }
.colors-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.color-swatch { aspect-ratio: 1; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: all 0.15s; touch-action: manipulation; }
.color-swatch.active { border-color: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.5); }
.texture-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.texture-btn { padding: 14px; background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  color: #aaa; font-family: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 1px; touch-action: manipulation; }
.texture-btn.active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); }
.shop-item { display: flex; align-items: center; gap: 14px; padding: 14px;
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px; margin-bottom: 10px; }
.shop-item.owned { border-color: #2ecc71; background: rgba(46,204,113,0.08); }
.shop-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.05); border-radius: 8px; flex-shrink: 0; }
.shop-icon svg { width: 22px; height: 22px; }
.shop-info { flex: 1; min-width: 0; }
.shop-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 3px; }
.shop-desc { font-size: 11px; color: #777; line-height: 1.3; }
.shop-buy { padding: 10px 16px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #fff;
  font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  white-space: nowrap; display: flex; align-items: center; gap: 4px;
  transition: all 0.15s; touch-action: manipulation; }
.shop-buy:hover:not(.disabled):not(.owned) { background: rgba(255,255,255,0.12); }
.shop-buy svg { width: 12px; height: 12px; }
.shop-buy.owned { background: transparent; border-color: #2ecc71; color: #2ecc71; cursor: default; }
.shop-buy.disabled { opacity: 0.35; cursor: not-allowed; }
#radial-menu { position: fixed; width: 1px; height: 1px; z-index: 60;
  pointer-events: none; opacity: 0; transition: opacity 0.2s; }
#radial-menu.show { pointer-events: auto; opacity: 1; }
.radial-btn { position: absolute; width: 60px; height: 60px; border-radius: 50%;
  background: rgba(11,11,20,0.96); border: 2px solid #2ecc71; color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transform: translate(-50%, -50%); transition: all 0.15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.7); touch-action: manipulation; }
.radial-btn svg { width: 26px; height: 26px; }
.radial-btn:hover { background: rgba(46,204,113,0.25); transform: translate(-50%, -50%) scale(1.1); }
.radial-btn:active { transform: translate(-50%, -50%) scale(0.95); }
.radial-btn[data-action="ally"] { left: 0; top: -80px; border-color: #2ecc71; }
.radial-btn[data-action="support"] { left: 80px; top: 0; border-color: #3498db; }
.radial-btn[data-action="break"] { left: 0; top: 80px; border-color: #e67e22; }
.radial-btn[data-action="attack"] { left: -80px; top: 0; border-color: #e74c3c; }
.radial-label { position: absolute; font-size: 10px; color: #ccc; white-space: nowrap;
  pointer-events: none; transform: translate(-50%, -50%);
  text-shadow: 0 1px 3px #000; font-weight: 600; }
@media (max-width: 640px) {
  #missile-panel { width: 100px; padding: 6px; }
  .m-name { font-size: 8px; }
  .bbtn { min-width: 44px; }
  .b-name { font-size: 7px; }
  #bottom-bar { gap: 4px; }
  #stats-panel { min-width: 82px; padding: 6px 8px; }
  .sp-limit-big { font-size: 13px; }
  #send-panel { min-width: 140px; padding: 5px 6px; }
  .send-btn { font-size: 10px; padding: 6px 1px; }
  .menu-title { font-size: 32px; letter-spacing: 8px; }
  #overlay h1 { font-size: 36px; }
  .submenu-title { font-size: 18px; letter-spacing: 4px; }
  #menu-topbar { font-size: 14px; padding: 6px 12px; }
  .overlay-actions { flex-direction: column; }
  .overlay-actions .menu-btn { min-height: 46px; }
  .qc-btn { width: 32px; height: 32px; }
  .qc-btn svg { width: 14px; height: 14px; }
}
@media (max-width: 420px) {
  #missile-panel { width: 80px; }
  .m-icon-svg { width: 14px; height: 14px; }
}
@media (pointer: coarse) {
  .qc-btn { width: 42px; height: 42px; }
  .qc-btn svg { width: 17px; height: 17px; }
  .radial-btn { width: 68px; height: 68px; }
  .radial-btn svg { width: 28px; height: 28px; }
  .send-btn { min-height: 40px; }
  .bbtn { min-height: 54px; }
  .menu-btn { min-height: 56px; }
}
</style>
</head>
<body>

<div id="menu-screen">
  <canvas id="menu-preview" width="500" height="500"></canvas>
  <div id="menu-topbar">
    <svg viewBox="0 0 24 24" fill="#f1c40f"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    <span id="stars-count">0</span>
  </div>
  <div id="menu-content">
    <h1 class="menu-title">WARFRONT</h1>
    <div class="menu-sub">Territorial War</div>
    <input class="menu-input" id="menu-nickname" placeholder="Ваш ник" maxlength="16" value="Игрок">
    <button class="menu-btn primary" id="menu-start">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Начать
    </button>
    <button class="menu-btn" id="menu-custom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18 3 3 0 0 0 3-3 3 3 0 0 1 3-3 3 3 0 0 0 3-3 9 9 0 0 0-9-9z"/></svg>
      Кастомизация
    </button>
    <button class="menu-btn" id="menu-shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l2-5h14l2 5"/><path d="M3 9v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9"/><path d="M9 9v2a3 3 0 0 0 6 0V9"/></svg>
      Магазин
    </button>
  </div>
</div>

<div class="submenu" id="custom-screen">
  <button class="submenu-close" onclick="closeSubmenu('custom-screen')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="submenu-title">Кастомизация</div>
  <div class="submenu-content">
    <div style="color:#aaa;font-size:11px;letter-spacing:3px;margin-bottom:12px;text-transform:uppercase;">Цвет территории</div>
    <div class="colors-grid" id="colors-grid"></div>
    <div style="color:#aaa;font-size:11px;letter-spacing:3px;margin:20px 0 12px;text-transform:uppercase;">Текстура</div>
    <div class="texture-grid" id="texture-grid">
      <button class="texture-btn" data-tex="solid">Однотонная</button>
      <button class="texture-btn" data-tex="stripes">Полосы</button>
      <button class="texture-btn" data-tex="diagonal">Диагональ</button>
      <button class="texture-btn" data-tex="dots">Точки</button>
    </div>
  </div>
</div>

<div class="submenu" id="shop-screen">
  <button class="submenu-close" onclick="closeSubmenu('shop-screen')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="submenu-title">Магазин</div>
  <div class="submenu-content" id="shop-list"></div>
</div>

<canvas id="c" style="display:none;"></canvas>

<div id="quick-controls" style="display:none;">
  <button class="qc-btn" onclick="toggleFullscreen()" title="Полный экран">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
  </button>
  <button class="qc-btn" onclick="resetView()" title="Центрировать">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="qc-btn" id="muteBtn" onclick="toggleMute()" title="Звук">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
  </button>
  <button class="qc-btn" onclick="confirmRestart()" title="Начать заново">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 013.51 15"/></svg>
  </button>
</div>

function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); }
function playTone(freq, dur, type, vol, slideTo) {
  if (!audioCtx || audioMuted) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(Math.max(20, freq), t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.1), t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  } catch(e) {}
}
function playNoise(dur, vol) {
  if (!audioCtx || audioMuted) return;
  try {
    const t = audioCtx.currentTime;
    const size = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
    const d = buffer.getChannelData(0);
    for (let i = 0; i < size; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 2);
    const src = audioCtx.createBufferSource(); src.buffer = buffer;
    const gain = audioCtx.createGain(); gain.gain.value = vol || 0.1;
    src.connect(gain); gain.connect(audioCtx.destination); src.start(t);
  } catch(e) {}
}

function hslToRgb(h, s, l) {

}

function addRivers() {

  const numRivers = 3 + Math.floor(Math.random() * 3);
  for (let r = 0; r < numRivers; r++) {

      const y = 20 + Math.floor(Math.random() * (H - 40));

    let x = sx, y = sy, dir = Math.random() * Math.PI * 2;
    const steps = 80 + Math.floor(Math.random() * 100);

      if (nx < 2 || nx >= W-2 || ny < 2 || ny >= H-2) break;
      const ni = ny*W + nx;

}

      const cur = queue[head++]; totalLandCells++;
      const x = cur % W, y = (cur / W) | 0;
      for (let k = 0; k < 4; k++) {
        const nx = x + NEIGHBORS[k][0], ny = y + NEIGHBORS[k][1];
        if (nx<0||nx>=W||ny<0||ny>=H) continue;

  const numC = 5 + Math.floor(Math.random() * 4);
  const centers = [];
  for (let i = 0; i < numC; i++) {
    const angle = (i / numC) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const dist = 35 + Math.random() * 60;
    centers.push({ x: W/2 + Math.cos(angle)*dist, y: H/2 + Math.sin(angle)*dist, r: 95 + Math.random()*55 });
  }

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const edgeDist = Math.min(x, W-1-x, y, H-1-y);
    if (edgeDist < 8) continue;
    let inside = false;
    for (const c of centers) {
      const dx = x-c.x, dy = y-c.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      const noiseOffset = (fbm(x*0.06, y*0.06, seed) - 0.5) * 34;

  for (const [dx, dy] of NEIGHBORS8) {

      if (nx<0||nx>=W||ny<0||ny>=H) continue;
      const ni = ny*W + nx;
      if (terrain[ni] || visited.has(ni)) continue;

  while (cur !== -1) { path.push({x: cur % W, y: (cur / W) | 0}); cur = cameFrom.get(cur); }

function hasWaterLineOfSight(a, b) {

    const t = i / steps;
    const x = Math.floor(a.x + dx * t + 0.5);
    const y = Math.floor(a.y + dy * t + 0.5);

      const supportPool = Math.floor(pop[player] * effectivePct);

    const a = +parts[0], b = +parts[1];
    const revKey = b + ',' + a;

        const lose = Math.min(attacks[i].pool, toLose);
        attacks[i].pool -= lose; toLose -= lose;
      }
      for (const j of revIdxs) attacks[j].pool = 0;
    } else if (revPool > fwdPool) {
      let toLose = fwdPool;
      for (const j of revIdxs) {
        if (toLose <= 0) break;
        const lose = Math.min(attacks[j].pool, toLose);
        attacks[j].pool -= lose; toLose -= lose;
      }

function getShipPos(s) {

function updateShips(dt) {
  for (let i = ships.length - 1; i >= 0; i--) {
    const s = ships[i];
    let distLeft = SHIP_SPEED * dt;
    while (distLeft > 0 && s.pathIdx < s.path.length - 1) {
      const a = s.path[s.pathIdx], b = s.path[s.pathIdx + 1];
      const segLen = Math.hypot(b.x-a.x, b.y-a.y);
      if (segLen < 0.001) { s.pathIdx++; s.progress = 0; continue; }
      const remaining = segLen * (1 - s.progress);
      if (distLeft >= remaining) { distLeft -= remaining; s.pathIdx++; s.progress = 0; }
      else { s.progress += distLeft / segLen; distLeft = 0; }
    }
    if (s.pathIdx >= s.path.length - 1) { landShip(s); ships.splice(i, 1); }
  }

  const landing = s.path[s.path.length - 1];
  if (!landing) { pop[s.player] += s.pool; return; }
  const landIdx = landing.y * W + landing.x;
  if (!terrain[landIdx]) { pop[s.player] += s.pool; return; }
  if (owner[landIdx] !== s.player) captureCell(s.player, landIdx);
  if (s.pool > 0) {
    if (!spawnAttackFrom(s.player, [landing], s.targetX, s.targetY, s.pool, s.targetOwner)) {
      pop[s.player] += s.pool;

  }

        distLeft -= remaining;

  }

    const mult = buildingLevelMult(b.level);
    if (b.type === 'city') cityBonus[b.owner] += mult;

    if (pop[i] < maxPop) pop[i] = Math.min(maxPop, pop[i] + growth * dt);

    const key = a.player + ',' + a.targetOwner;

      groups.set(key, {

        pool: 0, sumX: 0, sumY: 0, count: 0

    const cx = (g.sumX / g.count) * CELL + CELL / 2;
    const cy = (g.sumY / g.count) * CELL + CELL / 2 - 18 / cam.zoom;

    const isIncoming = (g.targetOwner === 0);
    const isOurs = (g.player === 0);

  if (hasAlly) chance *= 0.5;

  if (Math.random() < chance) {
    addAlliance(0, target);
    toast('Союз с ' + botNames[target-1]);
    sfxSuccess();
    recolorAlliances();
  } else {
    toast(botNames[target-1] + ' отказал');
    sfxError();
  }
}
function breakAlliance(target) {
  if (!isAlly(0, target)) { toast('Нет союза'); return; }
  removeAlliance(0, target);
  toast('Союз расторгнут');
  sfxError();
  recolorAlliances();
}

document.querySelectorAll('.radial-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const menu = document.getElementById('radial-menu');
    const target = parseInt(menu.dataset.target);
    const action = btn.dataset.action;
    if (!target || target <= 0) { hideRadialMenu(); return; }
    if (action === 'ally') {
      proposeAlliance(target);
    } else if (action === 'break') {
      breakAlliance(target);
    } else if (action === 'attack') {
      if (longPressCell) {
        startAttack(0, longPressCell.x, longPressCell.y);
      }
    } else if (action === 'support') {
      if (longPressCell) {
        startAttack(0, longPressCell.x, longPressCell.y);
      }
    }
    hideRadialMenu();
  });
});

function updateUI(dt) {
  const diff = pop[0] - displayPop;
  displayPop += diff * Math.min(1, dt * 10);
  const popInt = Math.round(displayPop);
  if (popInt !== lastPopInt) {
    const el = document.getElementById('youPop');
    if (el) el.textContent = fmtPop(displayPop);
    lastPopInt = popInt;
  }
  const maxInt = Math.round(lastMaxPop);
  if (maxInt !== lastMaxInt) {
    const el = document.getElementById('youMax');
    if (el) el.textContent = fmtPop(lastMaxPop);
    lastMaxInt = maxInt;
  }
  const growthInt = Math.round(lastGrowthRate || 0);
  if (growthInt !== lastGrowthInt) {
    const g = document.getElementById('youGrowth');
    if (g) g.textContent = fmtPop(growthInt);
    lastGrowthInt = growthInt;
  }
  const mInt = Math.floor(money[0]);
  if (mInt !== lastMoneyInt) {
    const el = document.getElementById('moneyAmt');
    if (el) el.textContent = fmtMoney(money[0]);
    lastMoneyInt = mInt;
    updateBuildButtons();
  }
  const incEl = document.getElementById('incomeAmt');
  if (incEl) incEl.textContent = lastIncome.toFixed(1);
  const sendHint = document.getElementById('sendHint');
  if (sendHint) {
    sendHint.textContent = '15% в резерве';
    sendHint.classList.toggle('active', attacks.some(a => a.player === 0));
  }
  updateMissileButtons();
}
function updateBuildButtons() {
  document.querySelectorAll('.bbtn[data-type]').forEach(btn => {
    const type = btn.dataset.type;
    btn.classList.toggle('active', type === buildingMode);
    btn.classList.toggle('disabled', money[0] < BUILDINGS[type].cost);
  });
  canvas.style.cursor = (buildingMode || missileMode) ? 'copy' : 'crosshair';
}
function updateMissileButtons() {
  const hasMissileBldg = hasBuilding(0, 'missile');
  document.querySelectorAll('.mbtn').forEach(btn => {
    const type = btn.dataset.mtype;
    if (type === 'xl' && !menuState.purchases.xlMissile) { btn.classList.add('locked'); return; }
    btn.classList.remove('locked');
    btn.classList.toggle('active', type === missileMode);
    btn.classList.toggle('disabled', money[0] < MISSILES[type].cost || !hasMissileBldg);
  });
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1800);
}
function screenFromEvent(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left), y: (clientY - r.top) };
}
function cellFromScreen(sx, sy) {
  const x = Math.floor((cam.x + sx / cam.zoom) / CELL);
  const y = Math.floor((cam.y + sy / cam.zoom) / CELL);
  if (x < 0 || x >= W || y < 0 || y >= H) return null;
  return { x, y };
}
function handleClick(cx, cy) {
  if (!gameActive) return;
  const s = screenFromEvent(cx, cy);
  const c = cellFromScreen(s.x, s.y);
  if (!c) return;
  const ti = c.y*W + c.x;
  if (missileMode) {
    if (launchMissile(0, missileMode, c.x, c.y)) { toast('Пуск: ' + MISSILES[missileMode].label); missileMode = null; updateMissileButtons(); }
    else { sfxError(); }
    return;
  }
  if (buildingMode) {
    const ok = tryBuild(0, ti, buildingMode);
    if (ok) { toast('Построено: ' + BUILDINGS[buildingMode].name); sfxBuild(); }
    else {
      const reasons = [];
      if (owner[ti] !== 0) reasons.push('нужна своя клетка');
      else if (buildings.has(ti)) reasons.push('клетка занята');
      else if (buildingMode === 'port' && !isCoastCell(ti)) reasons.push('порт только на берегу');
      else if (money[0] < BUILDINGS[buildingMode].cost) reasons.push('мало денег');
      else if (buildingTooClose(ti)) reasons.push('близко');
      toast(reasons.join(', ')); sfxError();
    }
    updateBuildButtons();
    return;
  }
  if (buildings.has(ti) && buildings.get(ti).owner === 0) {
    const res = tryUpgrade(0, ti);
    if (res.ok) { toast(`${res.name} → ур. ${res.level}`); sfxUpgrade(); }
    else { if (res.reason === 'макс. уровень') { toast('Максимум'); sfxError(); } else { toast(res.reason); sfxError(); } }
    updateBuildButtons();
    return;
  }
  if (terrain[ti] && owner[ti] !== 0) {
    startAttack(0, c.x, c.y);
  }
}

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const s = screenFromEvent(e.clientX, e.clientY);
  const wb = { x: cam.x + s.x/cam.zoom, y: cam.y + s.y/cam.zoom };
  const factor = e.deltaY > 0 ? 0.88 : 1.14;
  cam.zoom = Math.max(minZoom, Math.min(maxZoom, cam.zoom * factor));
  cam.x = wb.x - s.x/cam.zoom;
  cam.y = wb.y - s.y/cam.zoom;
  clampCamera();
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  initAudio();
  mouseDown = true;
  mouseStartX = e.clientX; mouseStartY = e.clientY;
  dragStartCamX = cam.x; dragStartCamY = cam.y;
  didDrag = false;
  longPressTriggered = false;

  const s = screenFromEvent(e.clientX, e.clientY);
  const c = cellFromScreen(s.x, s.y);
  if (c) {
    const ti = c.y*W + c.x;
    const op = owner[ti];
    if (op > 0) {
      longPressCell = c;
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(() => {
        if (!didDrag && gameActive) {
          longPressTriggered = true;
          showRadialMenu(e.clientX, e.clientY, op, c);
          mouseDown = false;
        }
      }, LONG_PRESS_MS);
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (touchMode) return;
  const s = screenFromEvent(e.clientX, e.clientY);
  hoverCell = cellFromScreen(s.x, s.y);
  if (mouseDown) {
    const dx = e.clientX - mouseStartX, dy = e.clientY - mouseStartY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      didDrag = true;
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }
    if (didDrag) { cam.x = dragStartCamX - dx/cam.zoom; cam.y = dragStartCamY - dy/cam.zoom; clampCamera(); }
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (longPressTriggered) { longPressTriggered = false; mouseDown = false; didDrag = false; return; }
  if (!didDrag && !touchMode) handleClick(e.clientX, e.clientY);
  mouseDown = false; didDrag = false;
});
canvas.addEventListener('mouseleave', () => { hoverCell = null; });
canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (buildingMode) { buildingMode = null; updateBuildButtons(); }
  if (missileMode) { missileMode = null; updateMissileButtons(); }
});

document.addEventListener('mousedown', (e) => {
  const menu = document.getElementById('radial-menu');
  if (menu.classList.contains('show') && !menu.contains(e.target)) {
    hideRadialMenu();
  }
}, true);

let touchStartX = 0, touchStartY = 0, touchStartCamX = 0, touchStartCamY = 0;
let touchMoved = false;
let lastTouchTime = 0;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  touchMode = true;
  initAudio();
  longPressTriggered = false;
  if (e.touches.length === 1) {
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
    touchStartCamX = cam.x; touchStartCamY = cam.y;
    touchMoved = false;

    const s = screenFromEvent(t.clientX, t.clientY);
    const c = cellFromScreen(s.x, s.y);
    if (c) {
      const ti = c.y*W + c.x;
      const op = owner[ti];
      if (op > 0) {
        longPressCell = c;
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          if (!touchMoved && gameActive) {
            longPressTriggered = true;
            showRadialMenu(t.clientX, t.clientY, op, c);
          }
        }, LONG_PRESS_MS);
      }
    }
  } else if (e.touches.length === 2) {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    const t1 = e.touches[0], t2 = e.touches[1];
    touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    pinchZoomActive = true;
  }
}, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1 && !pinchZoomActive) {
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
      touchMoved = true;
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }
    if (touchMoved) {
      cam.x = touchStartCamX - dx/cam.zoom;
      cam.y = touchStartCamY - dy/cam.zoom;
      clampCamera();
    }
  } else if (e.touches.length === 2 && pinchZoomActive) {
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    if (touchStartDist > 0) {      const factor = dist / touchStartDist;
      const midX = (t1.clientX + t2.clientX) / 2;
      const midY = (t1.clientY + t2.clientY) / 2;
      const s = screenFromEvent(midX, midY);
      const wb = { x: cam.x + s.x/cam.zoom, y: cam.y + s.y/cam.zoom };
      cam.zoom = Math.max(minZoom, Math.min(maxZoom, cam.zoom * factor));
      cam.x = wb.x - s.x/cam.zoom;
      cam.y = wb.y - s.y/cam.zoom;
      clampCamera();
      touchStartDist = dist;
    }
  }
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (pinchZoomActive && e.touches.length < 2) pinchZoomActive = false;
  if (longPressTriggered) { longPressTriggered = false; if (e.touches.length === 0) touchMoved = false; return; }
  if (!touchMoved && e.changedTouches.length > 0) {
    const t = e.changedTouches[0];
    const now = performance.now();
    if (now - lastTouchTime < 300) return;
    lastTouchTime = now;
    handleClick(t.clientX, t.clientY);
  }
  if (e.touches.length === 0) touchMoved = false;
}, { passive: false });

document.querySelectorAll('.send-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    initAudio();
    userSendPct = parseInt(btn.dataset.pct);
    userSendFraction = userSendPct / 100;
    document.querySelectorAll('.send-btn').forEach(b => b.classList.toggle('active', b === btn));
    sfxSuccess();
  });
});
document.querySelectorAll('.bbtn[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    initAudio();
    const type = btn.dataset.type;
    if (money[0] < BUILDINGS[type].cost) { toast('Мало денег'); sfxError(); return; }
    buildingMode = (buildingMode === type) ? null : type;
    if (buildingMode) missileMode = null;
    updateBuildButtons(); updateMissileButtons();
    if (buildingMode) { toast('Выберите клетку'); sfxSuccess(); }
  });
});
document.querySelectorAll('.mbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    initAudio();
    const type = btn.dataset.mtype;
    if (type === 'xl' && !menuState.purchases.xlMissile) { toast('XL не куплена'); sfxError(); return; }
    if (!hasBuilding(0, 'missile')) { toast('Нужна рак. установка'); sfxError(); return; }
    if (money[0] < MISSILES[type].cost) { toast('Нужно ' + fmtMoney(MISSILES[type].cost)); sfxError(); return; }
    missileMode = (missileMode === type) ? null : type;
    if (missileMode) buildingMode = null;
    updateMissileButtons(); updateBuildButtons();
    if (missileMode) { toast('Кликните по карте'); sfxSuccess(); }
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (buildingMode) { buildingMode = null; updateBuildButtons(); }
    if (missileMode) { missileMode = null; updateMissileButtons(); }
    hideRadialMenu();
  }
});
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
document.addEventListener('fullscreenchange', () => setTimeout(resizeCanvas, 50));
function loop(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  if (gameActive) update(dt);
  render(now);
  updateUI(dt);
  if (gameActive) requestAnimationFrame(loop);
}
function updateStarsDisplay() { document.getElementById('stars-count').textContent = menuState.stars; }
function openSubmenu(id) { document.getElementById(id).classList.add('active'); }
function closeSubmenu(id) { document.getElementById(id).classList.remove('active'); }
function buildColorsGrid() {
  const grid = document.getElementById('colors-grid');
  grid.innerHTML = '';
  COLOR_PRESETS.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'color-swatch' + (i === menuState.colorIndex ? ' active' : '');
    div.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
    div.onclick = () => { menuState.colorIndex = i; colors[0] = COLOR_PRESETS[i]; buildColorsGrid(); recolorPlayer0(); saveMenuState(); };
    grid.appendChild(div);
  });
}
function buildTextureGrid() {
  document.querySelectorAll('.texture-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tex === menuState.texture);
    btn.onclick = () => { menuState.texture = btn.dataset.tex; buildTextureGrid(); recolorPlayer0(); saveMenuState(); };
  });
}
function buildShop() {
  const list = document.getElementById('shop-list');
  list.innerHTML = '';
  SHOP_ITEMS.forEach(item => {
    const owned = menuState.purchases[item.id];
    const canAfford = menuState.stars >= item.cost;
    const div = document.createElement('div');
    div.className = 'shop-item' + (owned ? ' owned' : '');
    div.innerHTML = `
      <div class="shop-icon"><svg viewBox="0 0 24 24">${item.icon}</svg></div>
      <div class="shop-info">
        <div class="shop-name">${item.name}</div>
        <div class="shop-desc">${item.desc}</div>
      </div>
      <button class="shop-buy ${owned ? 'owned' : (canAfford ? '' : 'disabled')}">
        ${owned ? 'ОК' : '<svg viewBox="0 0 24 24" fill="#f1c40f"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>' + item.cost}
      </button>
    `;
    if (!owned && canAfford) {
      div.querySelector('.shop-buy').onclick = () => {
        menuState.stars -= item.cost;
        menuState.purchases[item.id] = true;
        updateStarsDisplay(); buildShop(); saveMenuState();
      };
    }
    list.appendChild(div);
  });
}

// ============ START / RESTART ============
function startGameImmediately() {
  if (menuState.purchases.fastStart) { money[0] += 3000; pop[0] += 300; }
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('c').style.display = 'block';
  document.getElementById('quick-controls').style.display = 'flex';
  document.getElementById('missile-panel').style.display = 'flex';
  document.getElementById('bottom-bar').style.display = 'flex';
  resizeCanvas(); resetView();
  gameStarted = true; gameActive = true;
  lastTime = performance.now();
  scheduleAd();
  requestAnimationFrame(loop);
}

function restartGame(goToMenu) {
  cancelAdSchedule();
  attacks = []; ships = []; boats = []; missiles = [];
  buildings = new Map();
  buildingCounts = new Uint32Array(PLAYER_COUNT);
  alliances = [];
  elapsed = 0; lastTime = performance.now();
  botTimer = 0; centroidTimer = 0;
  buildingMode = null; missileMode = null;
  displayPop = 0;
  lastPopInt = -1; lastMaxInt = -1; lastMoneyInt = -1; lastGrowthInt = -1;
  dirtyMinX = W; dirtyMaxX = -1; dirtyMinY = H; dirtyMaxY = -1;
  dirty = false;
  hoverCell = null;
  longPressTriggered = false;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  hideRadialMenu();

  for (let i = 0; i < W*H*4; i++) data[i] = 0;

  generateMap();
  initPlayers();
  placePlayers();
  updateCentroids();
  resizeCanvas();
  resetView();
  drawPreview();

  document.getElementById('menu-nickname').value = menuState.nickname;
  updateStarsDisplay();
  buildColorsGrid();
  buildTextureGrid();
  buildShop();

  document.getElementById('overlay').classList.remove('show');

  if (goToMenu) {
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('c').style.display = 'none';
    document.getElementById('quick-controls').style.display = 'none';
    document.getElementById('missile-panel').style.display = 'none';
    document.getElementById('bottom-bar').style.display = 'none';
    gameStarted = false;
    gameActive = true;
  } else {
    startGameImmediately();
  }
}

function confirmRestart() {
  if (confirm('Начать заново? Текущий прогресс будет потерян.')) {
    restartGame(false);
  }
}

loadMenuState();
generateMap();
initPlayers();
placePlayers();
updateCentroids();
resizeCanvas();
resetView();
drawPreview();
updateStarsDisplay();
buildColorsGrid();
buildTextureGrid();
buildShop();
document.getElementById('menu-nickname').value = menuState.nickname;
document.getElementById('menu-nickname').addEventListener('input', (e) => {
  menuState.nickname = e.target.value || 'Игрок';
  saveMenuState();
});
document.getElementById('menu-start').onclick = () => {
  menuState.nickname = document.getElementById('menu-nickname').value || 'Игрок';
  saveMenuState();
  startGameImmediately();
};
document.getElementById('menu-custom').onclick = () => { buildColorsGrid(); buildTextureGrid(); openSubmenu('custom-screen'); };
document.getElementById('menu-shop').onclick = () => { buildShop(); openSubmenu('shop-screen'); };
</script>
